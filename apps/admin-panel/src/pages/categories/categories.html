<app-blank pageTitle="Kategoriler" [breadcrumbs]="[{title:'Kategoriler', url:'categories', icon:'category_search'}]"  />

<flexi-grid 
[data]="data()" 
[loading]="isLoading()" 
language="tr" 
[showCaption]="true" 
captionTitle="Kategoriler" 
[showExportExcelBtn]="true" 
exportExcelFileName="Kategoriler" 
(onRefresh)="result.reload()"
>
    <ng-template flexiGridCaptionCommandTemplate >
        <flexi-button [routerLink]="['/','categories','create']" btnIcon="add" btnColor="primary" title="Ekle" flexiTooltip />
    </ng-template>

    <flexi-grid-column field="name" title="Kategori Adı" />

    <ng-template flexiGridColumnCommandTemplate let-item >
        <flexi-button [routerLink]="['/','categories','edit', item.id]" btnIcon="edit" btnColor="info" title="Güncelle" flexiTooltip />
        <flexi-button (click)="delete(item.id)" btnIcon="delete" btnColor="danger" title="Sil" flexiTooltip />
    </ng-template>

</flexi-grid>
