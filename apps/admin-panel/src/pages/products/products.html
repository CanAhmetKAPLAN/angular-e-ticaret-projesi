<app-blank pageTitle="Ürünler" [breadcrumbs]="[{title: 'Ürünler', url: '/products', icon: 'package_2'}]" />

<flexi-grid [data]="data()" [showCaption]="true" captionTitle="Ürün Listesi" [showExportExcelBtn]="true" language="tr" fontSize="15px" [loading]="loading()" (onRefresh)="result.reload()" >
    <flexi-grid-column field="imageUrl" title="Ürün Resmi" [filterable]="false" textAlign="center" width="70px">
        <ng-template flexiGridCellTemplate let-item >
            <img [src]="item.imageUrl" [alt]="item.name" width="70" height="70" style="object-fit: contain;">
        </ng-template>
    </flexi-grid-column>
    <flexi-grid-column field="name" title="Ürün Fiyatı" />
    <flexi-grid-column field="categoryName" title="Kategori Adı" filterType='select' [filterData]="categoryFilter()" />
    <flexi-grid-column field="price" title="Birim Fiyatı" filterType="number" textAlign="right" format="c" symbol="₺" />
    <flexi-grid-column field="stock" title="Stok Adedi" filterType="number" textAlign="right" />

    <ng-template flexiGridColumnCommandTemplate let-item >
        <flexi-button btnIcon="edit" btnColor="info" title="Güncelle" btnSize="small" flexiTooltip />
        <flexi-button btnIcon="delete" btnColor="danger" title="Sil" btnSize="small" flexiTooltip />
    </ng-template>
</flexi-grid>
