<app-blank [pageTitle]="cardTitle()" [breadcrumbs]="breadcrumbs()" />

    <div class="row">
        <div class="col-md-4 col-12">
            <div class="card">
                <div class="card-header">
                    <h4>{{cardTitle()}}</h4>
                </div>
                <div class="card-body">
                    <form #form = "ngForm" autocomplete="off" (ngSubmit)="save(form)" >
                        <div class="form-group">
                            <label for="">Kategori</label>
                            <flexi-select 
                            [data]="categories()"
                             label="name" 
                             value="id" 
                             [(ngModel)]="data().categoryId" name="categoryId" 
                             [required]="true" 
                             [loading]="categoryLoading()" 
                             language="tr" 
                             (ngModelChange)="setCategoryName()" />
                        </div>
                        <div class="form-group mt-2">
                            <label for="name">Ürün Adı</label>
                            <input type="text" class="form-control" [(ngModel)]="data().name" id="name" name="name" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="imageUrl">Ürün Resmi</label>
                            <input type="text" class="form-control" [(ngModel)]="data().imageUrl" id="imageUrl" name="imageUrl" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="price">Birim Fiyatı</label>
                            <input type="text" class="form-control" [(ngModel)]="data().price" id="price" name="price" mask="separator.2" thousandSeparator="." ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="stock">Stok Adedi</label>
                            <input type="text" class="form-control" [(ngModel)]="data().stock" id="stock" name="stock" ngModel >
                        </div>

                        <div class="form-group mt-2 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">{{btnName()}}</button>
                        </div>
                    </form>
                </div>
        </div>
    </div>
    </div>
