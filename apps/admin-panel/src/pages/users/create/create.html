<app-blank [pageTitle]="Title()" [breadcrumbs]="breadcrumbs()" />

    <div class="row">
        <div class="col-md-4 col-12">
            <div class="card">
                <div class="card-header">
                    <h4>{{Title()}}</h4>
                </div>
                <div class="card-body">
                    <form #form = "ngForm" autocomplete="off" (ngSubmit)="save(form)" >

                        <div class="form-check form-switch">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              role="switch"
                              id="checked" 
                              [(ngModel)]="data().isAdmin" 
                              name="isAdmin"
                              >
                            <label
                              class="form-check-label"
                              for="flexSwitchCheckChecked">Admin mi?</label>
                          </div>

                        <div class="form-group mt-2">
                            <label for="">Ad</label>
                            <input type="text" class="form-control" [(ngModel)]="data().firstName" id="firstName" name="kullanıcıAdı" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="">Soyad</label>
                            <input type="text" class="form-control" [(ngModel)]="data().lastName" id="lastName" name="kullanıcıSoyadı" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="">Kullanıcı Adı</label>
                            <input type="text" class="form-control" [(ngModel)]="data().userName" id="userName" name="userName" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="">Mail Adresi</label>
                            <input type="email" class="form-control" [(ngModel)]="data().email" id="email" name="email" ngModel >
                        </div>
                        <div class="form-group mt-2">
                            <label for="">Şifre</label>
                            <input type="password" class="form-control" [(ngModel)]="data().password" id="password" name="password" ngModel >
                        </div>
                        
                        <div class="form-group mt-2 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">{{btnName()}}</button>
                        </div>
                    </form>
                </div>
        </div>
    </div>
    </div>
