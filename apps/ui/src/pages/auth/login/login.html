<div class="login-header">
    <div class="login-icon">
        <i class="fas fa-user-circle"></i>
    </div>
    <h1>Hoş Geldiniz</h1>
    <p>Hesabınıza giriş yaparak alışverişe devam edin</p>
</div>

<div class="login-tabs">
    <button routerLink="/auth/login" class="tab-btn active" data-tab="login">
        <i class="fas fa-sign-in-alt"></i>
        Giriş Yap
    </button>
    <button routerLink="/auth/register" class="tab-btn" data-tab="register">
        <i class="fas fa-user-plus"></i>
        Kayıt Ol
    </button>
</div>

<!-- Register Form -->
<div class="tab-content active" id="register">
    <form #form="ngForm" class="auth-form" (ngSubmit)="signIn(form)">
        <div class="form-group">
            <label for="loginUserName">Kullanıcı Adı</label>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="text" id="loginUserName" ngModel name="userName" required placeholder="KullaniciAdi">
            </div>
        </div>

        <div class="form-group">
            <label for="loginPassword">Şifre</label>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" ngModel name="password" required placeholder="Şifrenizi girin">
            </div>
        </div>

        <button type="submit" class="auth-btn">
            <i class="fas fa-sign-in-alt"></i>
            Giriş Yap
        </button>
    </form>
</div>
